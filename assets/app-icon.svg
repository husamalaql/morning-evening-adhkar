  <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffb5d3"/><stop offset="1" stop-color="#ff8fbd"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0bd"/><stop offset=".48" stop-color="#d89a37"/><stop offset="1" stop-color="#fff0bd"/></linearGradient>
