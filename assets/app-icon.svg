<text x="512" y="525" text-anchor="middle" direction="rtl" unicode-bidi="plaintext" font-family="Noto Naskh Arabic, Noto Sans Arabic, Arial, sans-serif" font-size="126" font-weight="700" fill="#8d174c" stroke="#fff0f7" stroke-width="5" paint-order="stroke">أذكار</text>
