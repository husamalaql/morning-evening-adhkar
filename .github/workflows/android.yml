name: Build Android Release APKs (Capacitor 8)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'apk-update-manifest.json'
      - 'capacitor.config.json'
      - 'src/main.js'
      - 'src/live-update.js'
      - 'src/apk-updater.js'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Configure native APK installer
        shell: bash
        run: |
          set -euo pipefail
          JAVA_DIR="android/app/src/main/java/com/husamalaql/adhkar"
          mkdir -p "$JAVA_DIR" android/app/src/main/res/xml
          cp native/android/ApkInstallerPlugin.java "$JAVA_DIR/ApkInstallerPlugin.java"
          cp native/android/file_paths.xml android/app/src/main/res/xml/file_paths.xml
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />'
          if permission not in content:
              content = content.replace("<application", permission + "\n    <application", 1)
          provider = """    <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>"""
          if "androidx.core.content.FileProvider" not in content:
              content = content.replace("    </application>", provider + "\n    </application>", 1)
          manifest.write_text(content)

          main_activity = next(Path("android/app/src/main/java").rglob("MainActivity.java"))
          source = main_activity.read_text()
          if "ApkInstallerPlugin" not in source:
              source = source.replace(
                  "import com.getcapacitor.BridgeActivity;",
                  "import com.getcapacitor.BridgeActivity;\nimport android.os.Bundle;\nimport com.husamalaql.adhkar.ApkInstallerPlugin;"
              )
              empty_class = re.search(r"public\s+class\s+MainActivity\s+extends\s+BridgeActivity\s*\{\s*\}", source)
              if empty_class:
                  replacement = """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ApkInstallerPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }"""
                  source = source[:empty_class.start()] + replacement + source[empty_class.end():]
              else:
                  raise SystemExit("Unexpected MainActivity template; cannot register ApkInstallerPlugin")
              main_activity.write_text(source)
          PY

      - name: Create notification status icon
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_adhkar.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2 L14,7 L19,5 L17,10 L22,12 L17,14 L19,19 L14,17 L12,22 L10,17 L5,19 L7,14 L2,12 L7,10 L5,5 L10,7 Z"/>
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M12,6.5 L13.3,10.7 L17.5,12 L13.3,13.3 L12,17.5 L10.7,13.3 L6.5,12 L10.7,10.7 Z"/>
          </vector>
          XML

      - name: Set Android app version from package.json
        id: app_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          VERSION_CODE=$(node -e "const [major,minor,patch]=process.argv[1].split('.').map(Number); console.log(major*10000+minor*100+patch)" "$VERSION")
          python3 - "$VERSION" "$VERSION_CODE" <<'PY'
          import re, sys
          from pathlib import Path
          version, version_code = sys.argv[1], sys.argv[2]
          path = Path("android/app/build.gradle")
          content = path.read_text()
          content, code_count = re.subn(r'versionCode\s+\d+', f'versionCode {version_code}', content, count=1)
          content, name_count = re.subn(r'versionName\s+["\'][^"\']+["\']', f'versionName "{version}"', content, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit(f"Could not set Android version (versionCode matches: {code_count}, versionName matches: {name_count})")
          path.write_text(content)
          PY

      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore private Android release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/adhkar-release.jks
          test -s android/app/adhkar-release.jks

      - name: Configure release APK variants and signing
        working-directory: android
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          marker = "    buildTypes {"
          signing = """    signingConfigs {
              release {
                  storeFile file("adhkar-release.jks")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

          """
          splits = """    splits {
              abi {
                  enable true
                  reset()
                  include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                  universalApk true
              }
          }

          """
          if "signingConfigs {" not in s:
              if marker not in s:
                  raise SystemExit("Could not find buildTypes block in app/build.gradle")
              s = s.replace(marker, signing + marker, 1)
          if "splits {" not in s:
              if marker not in s:
                  raise SystemExit("Could not find buildTypes block in app/build.gradle")
              s = s.replace(marker, splits + marker, 1)
          s = s.replace("minifyEnabled false", "minifyEnabled true")
          if "shrinkResources true" not in s and "minifyEnabled true" in s:
              s = s.replace("minifyEnabled true", "minifyEnabled true\n            shrinkResources true", 1)
          release_marker = "        release {"
          if release_marker not in s:
              raise SystemExit("Could not find release buildType")
          import re
          s, count = re.subn(r"signingConfig signingConfigs\.debug", "signingConfig signingConfigs.release", s, count=1)
          if count == 0:
              s = s.replace(release_marker, release_marker + "\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY

      - name: Build release APKs only
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish individual APK files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: أذكار الصباح والمساء v${{ steps.app_version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk
            android/app/build/outputs/apk/release/app-arm64-v8a-release.apk
            android/app/build/outputs/apk/release/app-x86-release.apk
            android/app/build/outputs/apk/release/app-x86_64-release.apk
