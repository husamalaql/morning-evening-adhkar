name: Build Android Release APKs (Capacitor 8)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'data/**'
      - 'assets/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: npm run build

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Configure release APK variants
        working-directory: android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle")
          s = p.read_text()
          marker = "    buildTypes {"
          block = """    splits {
              abi {
                  enable true
                  reset()
                  include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                  universalApk true
              }
          }

          """
          if "splits {" not in s:
              if marker not in s:
                  raise SystemExit("Could not find buildTypes block in app/build.gradle")
              s = s.replace(marker, block + marker, 1)
          release_marker = "        release {"
          if "signingConfig signingConfigs.debug" not in s:
              if release_marker not in s:
                  raise SystemExit("Could not find release buildType")
              s = s.replace(release_marker, release_marker + "\n            // Signed for direct installation; use a private release key for Play Store publishing.\n            signingConfig signingConfigs.debug", 1)
          p.write_text(s)
          PY

      - name: Build release APKs only
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload release APK variants
        uses: actions/upload-artifact@v4
        with:
          name: adhkar-release-apks
          if-no-files-found: error
          path: android/app/build/outputs/apk/release/*.apk
