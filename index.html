<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8fb">
  <meta name="description" content="أذكار الصباح والمساء">
  <meta name="app-version" content="1.3.28">
  <title>أذكار الصباح والمساء</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <section class="hero" aria-labelledby="page-title">
      <div class="ornament ornament-top" aria-hidden="true">۞</div>
      <p class="eyebrow">أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ</p>
      <h1 id="page-title">أذكار الصباح<br><span>والمساء</span></h1>
      <p class="hero-description">ابدأ يومك بذكر الله، واختمه بقلبٍ مطمئن.</p>
      <div class="decorative-rule" aria-hidden="true"><i></i><span>✦</span><i></i></div>
    </section>
    <section class="choice-area" aria-label="اختيار الأذكار">
      <div class="prayer-buttons">
        <button class="prayer-card morning-card" data-section="morning" type="button">
          <span class="card-icon sun-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="10"/><path d="M32 5v9M32 50v9M5 32h9M50 32h9M13 13l7 7M44 44l7 7M51 13l-7 7M20 44l-7 7"/></svg>
          </span>
          <span class="card-copy"><strong>أذكار الصباح</strong><small>نورٌ لبداية يومك</small></span>
          <span class="card-arrow" aria-hidden="true">←</span>
        </button>
        <button class="prayer-card evening-card" data-section="evening" type="button">
          <span class="card-icon moon-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64"><path d="M46 42A23 23 0 0 1 22 7a24 24 0 1 0 24 35Z"/><path d="m45 9 2.5 5.5L53 17l-5.5 2.5L45 25l-2.5-5.5L37 17l5.5-2.5Z"/></svg>
          </span>
          <span class="card-copy"><strong>أذكار المساء</strong><small>سكينةٌ لختام يومك</small></span>
          <span class="card-arrow" aria-hidden="true">←</span>
        </button>
      </div>
    </section>
    <footer class="home-footer">
      <span class="footer-flower" aria-hidden="true">❀</span>
      <p>اجعل لسانك رطبًا بذكر الله</p>
    </footer>
    <button class="review-fab" id="settings-button" type="button" aria-label="الإعدادات" title="الإعدادات">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M8 4v4M15 10v4M10 16v4"/></svg>
    </button>
  </main>
  <div class="dialog-backdrop" id="dialog-backdrop" hidden>
    <section class="dialog dhikr-dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
      <button class="dialog-close" id="dialog-close" type="button" aria-label="إغلاق">×</button>
      <button class="dhikr-list-button" id="dhikr-list-button" type="button" aria-label="عرض قائمة الأذكار" title="عرض قائمة الأذكار">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
      </button>
      <div class="dialog-symbol" id="dialog-symbol" aria-hidden="true">۞</div>
      <h2 id="dialog-title">أذكار الصباح</h2>
      <div class="dialog-body" id="dialog-body"></div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
